name: 'Release Cross-Platform Binaries'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev zstd

      - name: Install Frontend dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Application
        run: bun run tauri build

      # Generate native Arch Linux .pkg.tar.zst package
      - name: Package Arch Linux .pkg.tar.zst
        if: matrix.os_name == 'linux'
        run: |
          RAW_TAG=${GITHUB_REF#refs/tags/v}
          PKG_VER=${RAW_TAG:-0.1.4}
          PKG_DIR=arch-pkg
          mkdir -p $PKG_DIR/usr/bin
          mkdir -p $PKG_DIR/usr/share/applications
          mkdir -p $PKG_DIR/usr/share/icons/hicolor/128x128/apps
          
          # Copy release binary
          cp src-tauri/target/release/app $PKG_DIR/usr/bin/synapse-mcq || find src-tauri/target/release -name "app" -type f -exec cp {} $PKG_DIR/usr/bin/synapse-mcq \;
          chmod +x $PKG_DIR/usr/bin/synapse-mcq
          
          # Desktop entry
          cat << 'EOF' > $PKG_DIR/usr/share/applications/synapse-mcq.desktop
          [Desktop Entry]
          Name=Synapse MCQ Studio
          Comment=Ultra-Low-RAM Desktop Platform for AI-Powered PDF MCQ Testing & Learning
          Exec=synapse-mcq
          Icon=synapse-mcq
          Terminal=false
          Type=Application
          Categories=Education;Development;
          EOF
          
          # Icon
          cp src-tauri/icons/128x128.png $PKG_DIR/usr/share/icons/hicolor/128x128/apps/synapse-mcq.png
          
          INST_SIZE=$(du -sb $PKG_DIR | cut -f1)
          
          cat << EOF > $PKG_DIR/.PKGINFO
          pkgname = synapse-mcq-desktop
          pkgbase = synapse-mcq-desktop
          pkgver = ${PKG_VER}-1
          pkgdesc = Ultra-Low-RAM Desktop Platform for AI-Powered PDF MCQ Testing & Learning
          url = https://github.com/manuja-me/synapse-mcq-desktop
          builddate = $(date +%s)
          packager = GitHub Actions CI
          size = $INST_SIZE
          arch = x86_64
          license = MIT
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = cairo
          depend = glib2
          depend = openssl
          EOF
          
          cd $PKG_DIR
          tar --zstd -cf ../synapse-mcq-desktop-${PKG_VER}-1-x86_64.pkg.tar.zst .PKGINFO usr
          cd ..
          ls -lh synapse-mcq-desktop-*.pkg.tar.zst

      - name: Upload Artifacts to Release
        id: upload_release
        continue-on-error: ${{ matrix.os_name == 'windows' }}
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            synapse-mcq-desktop-*.pkg.tar.zst
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Windows release upload once
        if: matrix.os_name == 'windows' && steps.upload_release.outcome == 'failure' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            synapse-mcq-desktop-*.pkg.tar.zst
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

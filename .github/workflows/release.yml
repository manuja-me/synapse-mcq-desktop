name: 'Release Cross-Platform Binaries'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os_name: 'macos'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'
          - platform: 'windows-latest'
            os_name: 'windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev zstd

      - name: Install Frontend dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Application
        run: bun run tauri build

      # Stage macOS Artifacts
      - name: Stage Artifacts (macOS)
        if: matrix.os_name == 'macos'
        run: |
          mkdir -p staging
          find src-tauri/target/release/bundle/dmg -name "*.dmg" -exec cp {} staging/ \;
          ls -lh staging/

      # Stage Linux Artifacts (.deb, .AppImage, and native Arch .pkg.tar.zst)
      - name: Stage Artifacts (Linux)
        if: matrix.os_name == 'linux'
        run: |
          mkdir -p staging
          
          # Extract dynamic package version
          RAW_TAG=${GITHUB_REF#refs/tags/v}
          if [[ "$RAW_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            PKG_VER=$RAW_TAG
          else
            PKG_VER=$(node -p "require('./package.json').version")
          fi
          
          # Copy deb and AppImage packages
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} staging/ \;
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} staging/ \;
          
          # Package Arch Linux .pkg.tar.zst
          PKG_DIR=arch-pkg
          mkdir -p $PKG_DIR/usr/bin
          mkdir -p $PKG_DIR/usr/share/applications
          mkdir -p $PKG_DIR/usr/share/icons/hicolor/128x128/apps
          
          cp src-tauri/target/release/app $PKG_DIR/usr/bin/synapse-mcq || find src-tauri/target/release -maxdepth 1 -type f -name "app" -exec cp {} $PKG_DIR/usr/bin/synapse-mcq \;
          chmod +x $PKG_DIR/usr/bin/synapse-mcq
          
          cat << 'EOF' > $PKG_DIR/usr/share/applications/synapse-mcq.desktop
          [Desktop Entry]
          Name=Synapse MCQ Studio
          Comment=Ultra-Low-RAM Desktop Platform for AI-Powered PDF MCQ Testing & Learning
          Exec=synapse-mcq
          Icon=synapse-mcq
          Terminal=false
          Type=Application
          Categories=Education;Development;
          EOF
          
          cp src-tauri/icons/128x128.png $PKG_DIR/usr/share/icons/hicolor/128x128/apps/synapse-mcq.png
          
          INST_SIZE=$(du -sb $PKG_DIR | cut -f1)
          
          cat << EOF > $PKG_DIR/.PKGINFO
          pkgname = synapse-mcq-desktop
          pkgbase = synapse-mcq-desktop
          pkgver = ${PKG_VER}-1
          pkgdesc = Ultra-Low-RAM Desktop Platform for AI-Powered PDF MCQ Testing & Learning
          url = https://github.com/manuja-me/synapse-mcq-desktop
          builddate = $(date +%s)
          packager = GitHub Actions CI
          size = $INST_SIZE
          arch = x86_64
          license = MIT
          depend = webkit2gtk-4.1
          depend = gtk3
          depend = cairo
          depend = glib2
          depend = openssl
          EOF
          
          cd $PKG_DIR
          tar --zstd -cf ../staging/synapse-mcq-desktop-${PKG_VER}-1-x86_64.pkg.tar.zst .PKGINFO usr
          cd ..
          ls -lh staging/

      # Stage Windows Artifacts (NSIS Setup, MSI, and Portable .zip)
      - name: Stage Artifacts (Windows)
        if: matrix.os_name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "staging"
          
          # Copy NSIS setup .exe and MSI installer
          if (Test-Path "src-tauri/target/release/bundle/nsis") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Copy-Item -Destination "staging"
          }
          if (Test-Path "src-tauri/target/release/bundle/msi") {
            Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Copy-Item -Destination "staging"
          }
          
          # Create standalone portable zip bundle
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path "portable-bin"
          Copy-Item "src-tauri/target/release/app.exe" -Destination "portable-bin/Synapse-MCQ-Studio.exe"
          Compress-Archive -Path "portable-bin/*" -DestinationPath "staging/Synapse-MCQ-Studio-v$version-windows-x64.zip" -Force
          Get-ChildItem -Path "staging"

      # Upload runner artifacts to GitHub Actions storage
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os_name }}
          path: staging/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: all-binaries
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd all-binaries
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: all-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 'Release Cross-Platform Binaries'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            target: 'x86_64-apple-darwin'
            arch: 'Intel'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            arch: 'Apple Silicon'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            arch: 'Linux'
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            arch: 'Windows'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libjavascriptcoregtk-4.1-dev libsoup-3.0-dev

      - name: Install Frontend dependencies
        run: bun install

      - name: Build Frontend
        run: bun run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Synapse MCQ Studio ${{ github.ref_name }}'
          releaseBody: |
            ## Synapse MCQ Studio Binary Release

            Ultra-Low-RAM Desktop Platform for AI-Powered PDF MCQ Testing & Learning.

            ### Included Binaries:
            - **Windows**: `.exe` / `.msi` installers
            - **macOS**: `.dmg` (Universal / Apple Silicon & Intel)
            - **Linux & Arch Linux**: `.AppImage` (portable universal binary, works directly on Arch Linux) and `.deb`
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
